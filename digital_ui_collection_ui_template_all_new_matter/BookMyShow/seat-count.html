<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>How Many Seats?</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="logo">book<span>myshow</span></div><div class="location">📍 Chennai</div></header><main class="wrap page centerbox"><div class="steps"><span class="step">1 Movie</span><span class="step">2 Showtime</span><span class="step active">3 Seats</span><span class="step">4 Payment</span></div><div class="panel center"><div style="color:#e21b53;font-size:10px;font-weight:900">TICKET SELECTION</div><h1>How many seats?</h1><p id="info" class="muted" style="margin-top:7px"></p><div style="font-size:80px;margin:25px">🎟️</div><div id="nums" style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap"></div><p class="muted" style="margin:18px 0">Normal ₹180 • Executive ₹280</p><a id="next" class="btn red" href="#">Select Seats</a></div></main><script>const q=new URLSearchParams(location.search),m=q.get('movie')||'Varanasi',d=q.get('date')||'02 Oct',th=q.get('theatre')||'Rakki Cinemas, Kelambakkam',t=q.get('time')||'10:15 AM';info.textContent=th+' • '+d+' • '+t;let n=1;for(let i=1;i<=10;i++){const b=document.createElement('button');b.className='chip'+(i===1?' active':'');b.textContent=i;b.onclick=()=>{n=i;document.querySelectorAll('#nums .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');update()};nums.appendChild(b)}function update(){next.href='seats.html?movie='+encodeURIComponent(m)+'&date='+encodeURIComponent(d)+'&theatre='+encodeURIComponent(th)+'&time='+encodeURIComponent(t)+'&count='+n}update()</script></body></html>
