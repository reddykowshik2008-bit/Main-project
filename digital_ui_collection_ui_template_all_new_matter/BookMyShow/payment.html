<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Payment</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="logo">book<span>myshow</span></div><div class="location">📍 Chennai</div></header><main class="wrap page"><div class="steps"><span class="step">1 Movie</span><span class="step">2 Showtime</span><span class="step">3 Seats</span><span class="step active">4 Payment</span><span class="step">5 Confirmation</span></div><div class="pay-layout"><section class="paybox"><h2>Payment</h2><p class="muted">Demo payment only — no real transaction.</p><label class="method active"><input type="radio" name="p" value="card" checked> 💳 Credit / Debit Card</label><label class="method"><input type="radio" name="p" value="upi"> 📱 UPI</label><label class="method"><input type="radio" name="p" value="wallet"> 👛 Wallet</label><form id="form"><div id="fields" class="formgrid"><div class="field full"><label>Name on Card</label><input required placeholder="Your Name"></div><div class="field full"><label>Card Number</label><input required placeholder="1234 5678 9012 3456"></div><div class="field"><label>Expiry</label><input required placeholder="MM/YY"></div><div class="field"><label>CVV</label><input required maxlength="3" placeholder="123"></div></div><button class="btn red" style="width:100%;margin-top:18px">Pay & Confirm</button></form></section><aside class="summary"><h3>Order Summary</h3><div class="line"><span>Movie</span><b id="m">-</b></div><div class="line"><span>Show</span><span id="show">-</span></div><div class="line"><span>Seats</span><span id="seats">-</span></div><div class="line total"><span>Total</span><span id="total">₹0</span></div></aside></div></main><script>const q=new URLSearchParams(location.search),m=q.get('movie')||'Varanasi',d=q.get('date')||'02 Oct',th=q.get('theatre')||'Rakki Cinemas, Kelambakkam',t=q.get('time')||'10:15 AM',se=q.get('seats')||'A1',total=q.get('total')||'210';document.getElementById('m').textContent=m;show.textContent=d+', '+t;seats.textContent=se;document.getElementById('total').textContent='₹'+total;document.querySelectorAll('.method').forEach(x=>x.onclick=()=>{document.querySelectorAll('.method').forEach(y=>y.classList.remove('active'));x.classList.add('active');const v=x.querySelector('input').value;fields.innerHTML=v==='card'?'<div class="field full"><label>Name on Card</label><input required placeholder="Your Name"></div><div class="field full"><label>Card Number</label><input required placeholder="1234 5678 9012 3456"></div><div class="field"><label>Expiry</label><input required placeholder="MM/YY"></div><div class="field"><label>CVV</label><input required maxlength="3" placeholder="123"></div>':v==='upi'?'<div class="field full"><label>UPI ID</label><input required placeholder="name@upi"></div>':'<div class="field full"><label>Wallet</label><select><option>PhonePe</option><option>Paytm</option><option>Amazon Pay</option></select></div>'});form.onsubmit=e=>{e.preventDefault();location.href='confirmation.html?movie='+encodeURIComponent(m)+'&date='+encodeURIComponent(d)+'&theatre='+encodeURIComponent(th)+'&time='+encodeURIComponent(t)+'&seats='+encodeURIComponent(se)+'&total='+total}</script></body></html>
