<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Chat</title><link rel="stylesheet" href="style.css"></head><body><div class="layout"><aside class="side"><div class="brand">ChatGPT</div><button class="new" onclick="location.href='chat.html'">＋ New chat</button><a class="link" href="index.html">⌂ Home</a><a class="link active" href="chat.html">💬 Chat</a><a class="link" href="history.html">◷ History</a><a class="link" href="settings.html">⚙ Settings</a></aside><main class="main"><header class="top"><span>New conversation</span><a class="badge" href="index.html">Home</a></header><div class="wrap"><div class="chat" id="chat"><div class="msg"><div class="avatar aiavatar">✦</div><div class="bubble">How can I help?</div></div></div><form class="composer" id="chatForm"><input id="msg" placeholder="Message ChatGPT..."><button class="send">↑</button></form></div></main></div><script>const p=new URLSearchParams(location.search),initial=p.get('q');function add(t,you){const x=document.createElement('div');x.className='msg '+(you?'you':'');x.innerHTML='<div class="avatar '+(you?'':'aiavatar')+'">'+(you?'Y':'✦')+'</div><div class="bubble"></div>';x.querySelector('.bubble').textContent=t;chat.appendChild(x)}function reply(t){add(/python/i.test(t)?'Python is a beginner-friendly language used for web, automation, AI and data science.':'This is a demo ChatGPT-style response. You can connect a real API later.')}if(initial){add(initial,true);setTimeout(()=>reply(initial),500)}chatForm.onsubmit=e=>{e.preventDefault();let t=msg.value.trim();if(!t)return;add(t,true);msg.value='';setTimeout(()=>reply(t),500)}</script></body></html>
