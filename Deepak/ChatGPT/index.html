<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ChatGPT Demo</title><link rel="stylesheet" href="style.css"></head><body><div class="layout"><aside class="side"><div class="brand">ChatGPT</div><button class="new" onclick="location.href='chat.html'">＋ New chat</button><a class="link active" href="index.html">⌂ Home</a><a class="link" href="chat.html">💬 Chat</a><a class="link" href="history.html">◷ History</a><a class="link" href="settings.html">⚙ Settings</a><hr><span class="muted">Recent</span><a class="link" href="chat.html?q=Explain%20Python">Explain Python</a><a class="link" href="chat.html?q=Web%20design">Web design</a></aside><main class="main"><header class="top"><span>ChatGPT</span><span class="badge">Free demo</span></header><div class="wrap"><section class="welcome"><h1>How can I help you today?</h1><p>Ask a question, brainstorm ideas or work on code.</p></section><div class="prompt-grid"><button class="prompt" data-q="Explain recursion in simple words">🧠<b>Explain</b></button><button class="prompt" data-q="Create a website landing page">💻<b>Create</b></button><button class="prompt" data-q="Write Python code">🐍<b>Code</b></button><button class="prompt" data-q="Give project ideas">✨<b>Brainstorm</b></button></div><div class="chat"><div class="msg"><div class="avatar aiavatar">✦</div><div class="bubble">Hello! I'm ChatGPT. What would you like to work on?</div></div><form class="composer" id="form"><input id="q" placeholder="Message ChatGPT..."><button class="send">↑</button></form></div></div></main></div><script>document.querySelectorAll('.prompt').forEach(x=>x.onclick=()=>location.href='chat.html?q='+encodeURIComponent(x.dataset.q));form.onsubmit=e=>{e.preventDefault();if(q.value.trim())location.href='chat.html?q='+encodeURIComponent(q.value.trim())}</script></body></html>
