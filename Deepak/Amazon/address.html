<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Address</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="logo">ama<span>zon</span></div><a href="index.html">Home</a></header><main class="wrap" style="padding:35px 0"><div class="panel"><h2>Choose a delivery address</h2><form id="form" class="form" style="margin-top:18px"><div class="field full"><label>Full Name</label><input required placeholder="Your Name"></div><div class="field full"><label>Address</label><input required placeholder="House / Street / Area"></div><div class="field"><label>City</label><input required value="Chennai"></div><div class="field"><label>PIN Code</label><input required maxlength="6" placeholder="600001"></div><button class="btn full">Use this address</button></form></div></main><script>const p=new URLSearchParams(location.search).get('product')||'Wireless Headphones';form.onsubmit=e=>{e.preventDefault();location.href='payment.html?product='+encodeURIComponent(p)}</script></body></html>
