<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Select Seats</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="logo">book<span>myshow</span></div><div class="location">📍 Chennai</div></header><main class="wrap page"><div class="steps"><span class="step">1 Movie</span><span class="step">2 Showtime</span><span class="step active">3 Seats</span><span class="step">4 Payment</span><span class="step">5 Confirmation</span></div><div class="seat-layout"><section class="seatbox"><h2>Select your seats</h2><p id="info" class="muted" style="margin-top:6px"></p><div class="screen"></div><small class="muted">SCREEN THIS WAY</small><div id="map" style="margin-top:22px"></div><p class="muted" style="margin-top:18px">Grey = Booked • Red = Selected</p></section><aside class="summary"><h3>Booking Summary</h3><div class="line"><span>Movie</span><b id="m">-</b></div><div class="line"><span>Seats</span><span id="s">-</span></div><div class="line"><span>Tickets</span><span id="amt">₹0</span></div><div class="line"><span>Fee</span><span id="fee">₹0</span></div><div class="line total"><span>Total</span><span id="total">₹0</span></div><button id="go" class="btn red" disabled>Continue to Payment</button></aside></div></main><script>const q=new URLSearchParams(location.search),m=q.get('movie')||'Varanasi',d=q.get('date')||'02 Oct',th=q.get('theatre')||'Rakki Cinemas, Kelambakkam',t=q.get('time')||'10:15 AM',count=+(q.get('count')||1);document.getElementById('m').textContent=m;info.textContent=th+' • '+d+' • '+t;const rows=['A','B','C','D','E','F','G'],booked=new Set(['A3','A4','B6','C2','D8','F4']),sel=new Set(),price=180;for(const r of rows){const row=document.createElement('div');row.className='row';for(let i=1;i<=10;i++){const x=document.createElement('button');x.className='seat';x.textContent=i;x.dataset.seat=r+i;if(booked.has(x.dataset.seat))x.classList.add('booked');x.onclick=()=>{if(x.classList.contains('booked'))return;if(sel.has(x.dataset.seat)){sel.delete(x.dataset.seat);x.classList.remove('selected')}else if(sel.size<count){sel.add(x.dataset.seat);x.classList.add('selected')}update()};row.appendChild(x)}map.appendChild(row)}function update(){const n=sel.size,total=n*price+(n?30:0);s.textContent=n?[...sel].join(', '):'Select '+count+' seat(s)';amt.textContent='₹'+n*price;fee.textContent='₹'+(n?30:0);document.getElementById('total').textContent='₹'+total;go.disabled=n!==count;if(n===count)go.onclick=()=>location.href='payment.html?movie='+encodeURIComponent(m)+'&date='+encodeURIComponent(d)+'&theatre='+encodeURIComponent(th)+'&time='+encodeURIComponent(t)+'&seats='+encodeURIComponent([...sel].join(','))+'&total='+total}update()</script></body></html>
