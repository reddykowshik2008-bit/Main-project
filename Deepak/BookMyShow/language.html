<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Select Language & Format</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="logo">book<span>myshow</span></div><div class="location">📍 Chennai</div></header><main class="wrap page centerbox"><div class="panel"><div style="color:#e21b53;font-size:10px;font-weight:900;letter-spacing:1.5px">SELECT LANGUAGE & FORMAT</div><h1 id="movie" style="margin:9px 0 5px">Varanasi</h1><p class="muted">Choose a language and cinema format.</p><div style="text-align:left;margin-top:22px"><b>Telugu</b><div style="display:flex;gap:8px;margin-top:12px"><button class="chip" data-f="2D">2D</button><button class="chip" data-f="IMAX 2D">IMAX 2D</button><button class="chip" data-f="Select all">Select All</button></div></div><a id="go" class="btn red" href="#" style="margin-top:25px">Continue</a></div></main><script>const m=new URLSearchParams(location.search).get('movie')||'Varanasi';movie.textContent=m;let fmt='2D';document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{document.querySelectorAll('.chip').forEach(y=>y.classList.remove('active'));x.classList.add('active');fmt=x.dataset.f;go.href='showtimes.html?movie='+encodeURIComponent(m)+'&format='+encodeURIComponent(fmt)});document.querySelector('.chip').click()</script></body></html>
